name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      # The web app builds without any environment (it is read on the first request).
      - run: pnpm --filter @bizcost/web build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Supabase CLI version as local development: the root package.json pin is the only source.
      - id: supabase-cli
        run: echo "version=$(jq -r '.devDependencies.supabase' package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.supabase-cli.outputs.version }}
      - name: Migrations match the Drizzle schema
        run: |
          pnpm --filter @bizcost/db db:generate
          git status --porcelain supabase/migrations
          test -z "$(git status --porcelain supabase/migrations)"
      # A throwaway ES256 signing key for this run's Auth server (config.toml signing_keys_path; the
      # file is gitignored). The API accepts only asymmetric tokens, verified with getClaims().
      - run: pnpm auth:signing-key
      # Postgres (migrations + seed.sql), Auth and the API gateway: what pgTAP, the @bizcost/db tests
      # and the @bizcost/api integration tests need. `supabase db start` alone has no Auth server.
      - run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - run: pnpm --filter @bizcost/db test:db
      - run: pnpm --filter @bizcost/api test:api
