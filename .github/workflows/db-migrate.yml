name: DB migrate

# Applies supabase/migrations to a hosted Supabase project, then the project settings of
# supabase/config.toml (docs/ARCHITECTURE.md §Runbooks › Migrations). Manual only: never on a push or
# a pull request. Each target is a GitHub Environment (Settings → Environments) that holds its
# project's secrets:
#   secrets  SUPABASE_ACCESS_TOKEN (a Supabase personal access token), SUPABASE_DB_PASSWORD (the
#            project's postgres password), SUPABASE_PROJECT_REF (the 20-letter project ref)
#   variable APP_URL (the web app's origin, e.g. https://app.example.com): Auth's site URL
# `production` has required reviewers, so a run waits for the owner's approval before it starts; both
# environments allow the main branch only. Until the secrets exist, a run stops at its first step and
# names the missing ones.
#
# The access token works for every project of the owner's account, so the secrets reach only the
# steps that talk to the project (step-level `env`), never the checkout or the CLI install, and the
# actions are pinned by commit SHA. A new target (e.g. a region move, §Runbooks) is added to
# `options` below by a pull request to main first.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Supabase project to migrate
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Only show what would change (migrations and settings)
        type: boolean
        default: false

permissions:
  contents: read

# One run per project at a time; a second one waits instead of cancelling a push half-way.
concurrency:
  group: db-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    # Migrations reach staging and production from main only (local → staging → production).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Require the environment's secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF APP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The '${{ inputs.environment }}' environment lacks:$missing (PROJECT_REF is the secret SUPABASE_PROJECT_REF, APP_URL the variable)"
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must be an https:// origin"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Supabase CLI version as local development and CI: the root package.json pin (read with
      # jq; no pnpm install, so no package code runs in this job).
      - id: supabase-cli
        run: echo "version=$(jq -r '.devDependencies.supabase' package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.supabase-cli.outputs.version }}
      # Every CLI command loads config.toml, whose signing_keys_path must exist. Hosted projects keep
      # their own signing keys, so an empty list is enough (never a real key here).
      - run: echo '[]' > supabase/signing_keys.json
      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Migrations on the project and here
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
      # Never --include-seed: seed.sql sets the local-only API password (its guard would refuse anyway).
      - name: Migrations that would be applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run
      # What `config push` below would change (read-only). config.toml's site URL and redirect list are
      # the local app's; the CLI reads SUPABASE_<SECTION>_<KEY> over config.toml, so the diff and the
      # push both use the environment's APP_URL instead. Read it before the real run (runbook step 3):
      # a setting the dashboard customized on purpose would be overwritten.
      - name: Project settings that would change (Auth, API, Storage)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_SITE_URL: ${{ vars.APP_URL }}
          SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS: ${{ vars.APP_URL }}
        run: supabase config diff --project-ref "$PROJECT_REF"
      - if: ${{ !inputs.dry_run }}
        name: Apply the migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes
      - if: ${{ !inputs.dry_run }}
        name: Project settings from config.toml (Auth, API, Storage)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_SITE_URL: ${{ vars.APP_URL }}
          SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS: ${{ vars.APP_URL }}
        run: supabase config push --project-ref "$PROJECT_REF" --yes
      - if: ${{ !inputs.dry_run }}
        name: Migrations on the project after the push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
